<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>
  html,body{margin:0;background:#0b0d10;color:#dfe3e8;font-family:Inter,system-ui,sans-serif}
  .wrap{padding:34px 34px 26px}
  .top{display:flex;align-items:baseline;gap:16px;margin-bottom:18px}
  .t{font-size:30px;font-weight:800;letter-spacing:.14em}
  .s{font-size:12px;letter-spacing:.24em;color:#8b949e;text-transform:uppercase}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
  figure{margin:0;position:relative;overflow:hidden;border:1px solid #1e242b;background:#000}
  img{display:block;width:100%;height:auto}
  figcaption{position:absolute;left:10px;bottom:8px;font-size:11px;letter-spacing:.2em;
    color:#e8edf2;text-shadow:0 1px 6px #000;background:rgba(0,0,0,.28);padding:3px 7px}
  .foot{margin-top:16px;display:flex;justify-content:space-between;font-size:11px;color:#6e7681;letter-spacing:.18em}
</style></head>
<body><div class="wrap">
  <div class="top"><div class="t">HARVESTER</div><div class="s">World's Edge · realtime scene · shot board</div></div>
  <div class="grid">
    <figure><img src="shots/h0.png"><figcaption>01 ARRIVAL</figcaption></figure>
    <figure><img src="shots/h1.png"><figcaption>02 THE TOWER</figcaption></figure>
    <figure><img src="shots/h2.png"><figcaption>03 THE DECK</figcaption></figure>
    <figure><img src="shots/h3.png"><figcaption>04 THE BASIN</figcaption></figure>
    <figure><img src="shots/h4.png"><figcaption>05 THE ARM</figcaption></figure>
    <figure><img src="shots/h5.png"><figcaption>06 HARVEST</figcaption></figure>
  </div>
  <div class="foot"><span>THREE.JS · REALTIME · 1600×900</span><span>HAMMOND ROBOTICS / SITE 05</span></div>
</div></body></html>
